name: Generate pronunciation audio

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_audio.py"
      - ".github/workflows/generate-audio.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependency
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Install Kokoro
        run: pip install "kokoro>=0.9.4" soundfile numpy

      - name: Generate fixed WAV
        run: python scripts/generate_audio.py

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/yijun-liu.wav
          if git diff --cached --quiet; then
            echo "Audio unchanged"
          else
            git commit -m "Generate pronunciation audio with Kokoro"
            git push
          fi
