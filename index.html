<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pronunciation of Yijun Liu" />
  <title>Yijun Liu — Name Pronunciation</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #171717;
      --muted: #666666;
      --border: #ddddda;
      --button: #ba0c2f;
      --button-hover: #9b0a27;
      --button-text: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --card: #1d1d1d;
        --text: #f3f3f3;
        --muted: #b3b3b3;
        --border: #3a3a3a;
        --button: #d51b46;
        --button-hover: #e52b55;
        --button-text: #ffffff;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .card {
      width: min(100%, 460px);
      padding: 42px 36px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .pronunciation {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1rem;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      background: var(--button);
      color: var(--button-text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }

    button:hover { background: var(--button-hover); }
    button:active { transform: scale(0.98); }

    button:focus-visible {
      outline: 3px solid rgba(186, 12, 47, 0.28);
      outline-offset: 3px;
    }

    .fallback {
      display: none;
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="name">
    <h1 id="name">Yijun Liu</h1>
    <p class="pronunciation">Pronounced <strong>ee-June lyoh</strong></p>

    <button id="playButton" type="button" aria-label="Hear Yijun Liu's name pronounced">
      🔊 Hear my name
    </button>

    <audio id="nameAudio" preload="auto" src="audio/yijun-liu.wav"></audio>
    <p id="fallback" class="fallback">Using your browser's built-in voice because the recorded pronunciation is unavailable.</p>
  </main>

  <script>
    const button = document.getElementById("playButton");
    const audio = document.getElementById("nameAudio");
    const fallback = document.getElementById("fallback");

    function speakFallback() {
      if (!("speechSynthesis" in window)) {
        fallback.textContent = "Audio playback is unavailable in this browser.";
        fallback.style.display = "block";
        return;
      }

      fallback.style.display = "block";
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance("E June lyoh");
      utterance.lang = "en-US";
      utterance.rate = 0.82;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    async function playName() {
      fallback.style.display = "none";
      try {
        audio.currentTime = 0;
        await audio.play();
      } catch (e) {
        speakFallback();
      }
    }

    audio.addEventListener("error", () => {
      audio.dataset.failed = "true";
    });

    button.addEventListener("click", () => {
      if (audio.dataset.failed === "true") speakFallback();
      else playName();
    });
  </script>
</body>
</html>
