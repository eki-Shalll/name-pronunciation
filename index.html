<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pronunciation of Yijun Liu" />
  <title>Yijun Liu — Name Pronunciation</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #171717;
      --muted: #666666;
      --border: #ddddda;
      --button: #ba0c2f;
      --button-hover: #9b0a27;
      --button-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --card: #1d1d1d;
        --text: #f3f3f3;
        --muted: #b3b3b3;
        --border: #3a3a3a;
        --button: #d51b46;
        --button-hover: #e52b55;
        --button-text: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      width: min(100%, 520px);
      padding: 42px 36px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .pronunciation {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 1rem;
    }
    .controls {
      display: grid;
      gap: 14px;
    }
    .variant-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--button);
      color: var(--button-text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--button-hover); }
    .secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .secondary:hover { background: rgba(127,127,127,.08); }
    .speed-wrap {
      display: grid;
      gap: 6px;
      margin-top: 4px;
    }
    .speed-label {
      color: var(--muted);
      font-size: .9rem;
    }
    input[type="range"] { width: 100%; }
    .note {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="name">
    <h1 id="name">Yijun Liu</h1>
    <p class="pronunciation">Pronounced <strong>ee-June Leo</strong></p>

    <div class="controls">
      <div class="variant-row">
        <button id="playPlain" type="button">🔊 Yijun Leo</button>
        <button id="playHyphen" class="secondary" type="button">🔊 Yi-Jun Leo</button>
      </div>

      <div class="speed-wrap">
        <label class="speed-label" for="speed">Playback speed: <span id="speedValue">0.75×</span></label>
        <input id="speed" type="range" min="0.60" max="1.10" step="0.05" value="0.75" />
      </div>
    </div>

    <audio id="audioPlain" preload="auto" src="audio/yijun-leo.wav"></audio>
    <audio id="audioHyphen" preload="auto" src="audio/yi-jun-leo.wav"></audio>

    <p class="note">Both versions use the same AI voice. Audio is generated slowly at the model level, and playback speed can be adjusted without changing pitch.</p>
  </main>

  <script>
    const plain = document.getElementById('audioPlain');
    const hyphen = document.getElementById('audioHyphen');
    const speed = document.getElementById('speed');
    const speedValue = document.getElementById('speedValue');

    for (const audio of [plain, hyphen]) {
      audio.preservesPitch = true;
      audio.mozPreservesPitch = true;
      audio.webkitPreservesPitch = true;
    }

    function applySpeed() {
      const rate = Number(speed.value);
      plain.playbackRate = rate;
      hyphen.playbackRate = rate;
      speedValue.textContent = rate.toFixed(2).replace(/0$/, '') + '×';
    }

    function play(audio) {
      for (const other of [plain, hyphen]) {
        if (other !== audio) {
          other.pause();
          other.currentTime = 0;
        }
      }
      audio.currentTime = 0;
      applySpeed();
      audio.play();
    }

    speed.addEventListener('input', applySpeed);
    document.getElementById('playPlain').addEventListener('click', () => play(plain));
    document.getElementById('playHyphen').addEventListener('click', () => play(hyphen));
    applySpeed();
  </script>
</body>
</html>
