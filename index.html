<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pronunciation of Yijun Liu" />
  <title>Yijun Liu — Name Pronunciation</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #171717;
      --muted: #666666;
      --border: #ddddda;
      --button: #ba0c2f;
      --button-hover: #9b0a27;
      --button-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --card: #1d1d1d;
        --text: #f3f3f3;
        --muted: #b3b3b3;
        --border: #3a3a3a;
        --button: #d51b46;
        --button-hover: #e52b55;
        --button-text: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      width: min(100%, 500px);
      padding: 42px 36px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .pronunciation {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 1rem;
    }
    .controls {
      display: grid;
      gap: 14px;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      background: var(--button);
      color: var(--button-text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      justify-self: center;
    }
    button:hover { background: var(--button-hover); }
    .speed-wrap {
      display: grid;
      gap: 6px;
      margin-top: 2px;
    }
    .speed-label {
      color: var(--muted);
      font-size: .9rem;
    }
    input[type="range"] { width: 100%; }
    .note {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="name">
    <h1 id="name">Yijun Liu</h1>
    <p class="pronunciation">Pronounced <strong>ee-June Leo</strong></p>

    <div class="controls">
      <button id="playButton" type="button">🔊 Hear my name</button>

      <div class="speed-wrap">
        <label class="speed-label" for="speed">Playback speed: <span id="speedValue">1.00×</span></label>
        <input id="speed" type="range" min="0.70" max="1.10" step="0.05" value="1.00" />
      </div>
    </div>

    <audio id="nameAudio" preload="auto" src="audio/yijun-liu.wav"></audio>

    <p class="note">Generated from tone-stripped Mandarin phonemes, with the recording itself produced slightly slower for clarity.</p>
  </main>

  <script>
    const audio = document.getElementById('nameAudio');
    const speed = document.getElementById('speed');
    const speedValue = document.getElementById('speedValue');

    audio.preservesPitch = true;
    audio.mozPreservesPitch = true;
    audio.webkitPreservesPitch = true;

    function applySpeed() {
      const rate = Number(speed.value);
      audio.playbackRate = rate;
      speedValue.textContent = rate.toFixed(2) + '×';
    }

    speed.addEventListener('input', applySpeed);
    document.getElementById('playButton').addEventListener('click', () => {
      audio.currentTime = 0;
      applySpeed();
      audio.play();
    });

    applySpeed();
  </script>
</body>
</html>
